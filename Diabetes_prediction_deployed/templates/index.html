<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="/">Home</a>
        </div>
        <div class="nav-center">
            🩺 Diabetes Prediction System
        </div>
        <div class="nav-right">
            <a href="/history">History</a>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <!-- <h1>🩺 Diabetes Prediction System</h1> -->
        <form action="/predict" method="POST">
            <input type="number" name="Pregnancies" placeholder="Pregnancies" required><br><br>
            <input type="number" name="Glucose" placeholder="Glucose" required><br><br>
            <input type="number" name="BloodPressure" placeholder="Blood Pressure" required><br><br>
            <input type="number" name="SkinThickness" placeholder="Skin Thickness" required><br><br>
            <input type="number" name="Insulin" placeholder="Insulin" required><br><br>
            <input type="number" step="0.1" name="BMI" placeholder="BMI" required><br><br>
            <input type="number" step="0.001" name="DiabetesPedigreeFunction"
                placeholder="Diabetes Pedigree Function" required><br><br>
            <input type="number" name="Age" placeholder="Age" required><br><br>
            <button type="submit">Predict</button>
        </form>
    </div>
    <script>
        setTimeout(() => {
            const flash = document.querySelector('.flash');
            if(flash){
                flash.style.display = 'none';
            }
        }, 5000);
    </script>
</body>
</html>
